<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0c1822" />
  <meta name="description" content="עיר פתוחה תלת־ממדית לחקירה, נהיגה וטיסה." />
  <title>Stairway City Explorer — עיר פתוחה</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./styles.css" />
  <style>
    #boot-status { position: fixed; inset: 0; z-index: 99999; display: grid; place-items: center; padding: 24px; background: #0b1720; color: #f4f7fa; font-family: Rubik, sans-serif; text-align: center; }
    .boot-card { width: min(560px, 100%); padding: 30px; border: 1px solid #40515d; border-radius: 18px; background: #142633; box-shadow: 0 18px 70px #0008; }
    .boot-card h1 { margin: 0 0 14px; font-size: 24px; } .boot-card p { line-height: 1.7; color: #d1dce4; }
    .boot-hint { color: #9fd7ff !important; } .boot-spinner { width: 38px; height: 38px; margin: 0 auto 18px; border: 4px solid #40515d; border-top-color: #75c9ff; border-radius: 50%; animation: bootspin 1s linear infinite; }
    @keyframes bootspin { to { transform: rotate(360deg); } }
    .boot-error button { margin: 12px; padding: 11px 22px; border: 0; border-radius: 10px; background: #75c9ff; color: #10202b; font: inherit; font-weight: 700; cursor: pointer; }
    .boot-error details { margin-top: 16px; text-align: right; } .boot-error pre { overflow-wrap: anywhere; white-space: pre-wrap; direction: ltr; text-align: left; color: #ffc7c7; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "react": "https://esm.sh/react@19.2.0",
      "react/jsx-runtime": "https://esm.sh/react@19.2.0/jsx-runtime",
      "react-dom/client": "https://esm.sh/react-dom@19.2.0/client?external=react",
      "three": "https://esm.sh/three@0.187.0",
      "@react-three/fiber": "https://esm.sh/@react-three/fiber@9.0.0?external=react,react-dom,three",
      "@react-three/drei": "https://esm.sh/@react-three/drei@10.0.0?external=react,react-dom,three,@react-three/fiber"
    }
  }
  </script>
</head>
<body>
  <div id="root"></div>
  <div id="boot-status" role="status" aria-live="polite">
    <div class="boot-card">
      <div class="boot-spinner"></div>
      <h1>טוען את Stairway City Explorer…</h1>
      <p>המשחק טוען רכיבי תלת־ממד. בדרך כלל זה לוקח כמה שניות.</p>
      <p class="boot-hint">אם המסך נשאר כך, בדוק שיש חיבור לאינטרנט ונסה לרענן את הדף.</p>
    </div>
  </div>
  <script>
    (() => {
      const panel = () => document.getElementById('boot-status');
      window.showStairwayBootError = (message) => {
        const el = panel(); if (!el) return;
        el.innerHTML = '<div class="boot-card boot-error"><h1>המשחק לא הצליח להיטען</h1>' +
          '<p>כנראה שהדפדפן לא הצליח להוריד את ספריות התלת־ממד מהאינטרנט.</p>' +
          '<p>בדוק חיבור לאינטרנט, ואז לחץ על הכפתור לרענון.</p>' +
          '<button type="button" onclick="location.reload()">נסה שוב</button>' +
          '<details><summary>פרטי התקלה</summary><pre></pre></details></div>' ;
        const pre = el.querySelector('pre'); if (pre) pre.textContent = String(message || 'לא התקבל פירוט');
      };
      window.addEventListener('error', (event) => {
        if (event && (event.message || event.target instanceof HTMLScriptElement))
          window.showStairwayBootError(event.message || 'טעינת קובץ JavaScript נכשלה');
      }, true);
      window.addEventListener('unhandledrejection', (event) => {
        window.showStairwayBootError(event.reason?.message || event.reason || 'שגיאת טעינה לא מטופלת');
      });
      window.setTimeout(() => {
        if (!window.__stairwayAppReady && panel())
          window.showStairwayBootError('הטעינה ארכה יותר מהרגיל. ייתכן שהחיבור ל-CDN חסום או איטי.');
      }, 18000);
    })();
  </script>
  <script type="module" src="./main.js" onerror="window.showStairwayBootError('לא ניתן לטעון את קובץ המשחק main.js')"></script>
</body>
</html>
