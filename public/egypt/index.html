<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>מצרים: המסע</title>
<meta name="description" content="משחק תלת מימד במצרים העתיקה: בחר להיות מצרי או עברי, וגלה את הארץ מהנילוס ועד הפירמידות.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;900&display=swap">
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
</script>
<style>
  :root {
    --sand: #e2c48c;
    --ink: #2a1a0a;
    --panel: rgba(42, 26, 10, 0.78);
    --gold: #ffd34d;
    --cream: #fff8e6;
    --line: rgba(255, 211, 77, 0.45);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --panel: rgba(18, 10, 3, 0.85); }
  }
  :root[data-theme="dark"] { --panel: rgba(18, 10, 3, 0.85); }

  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--sand); }
  body { font-family: Heebo, Arial, sans-serif; color: var(--cream); user-select: none; }
  #scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
  #scene:active { cursor: grabbing; }

  [hidden] { display: none !important; }

  /* Entry: two paths */
  #intro {
    position: fixed; inset: 0; display: grid; place-items: center; padding: 16px;
    background: radial-gradient(ellipse at center, rgba(60, 34, 10, 0.35), rgba(30, 16, 4, 0.82));
  }
  .intro-box { width: min(720px, 100%); text-align: center; }
  .intro-box h1 { margin: 0 0 6px; font-weight: 900; font-size: clamp(30px, 6vw, 52px); color: var(--gold); text-shadow: 0 3px 14px rgba(0,0,0,.5); }
  .intro-box > p { margin: 0 0 22px; font-size: clamp(16px, 2.6vw, 19px); line-height: 1.6; }
  .cards { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .card {
    font: inherit; color: var(--cream); text-align: right; cursor: pointer;
    background: var(--panel); border: 2px solid var(--line); border-radius: 16px; padding: 20px 20px 18px;
    transition: transform .15s ease, border-color .15s ease, box-shadow .15s ease;
    box-shadow: 0 10px 30px rgba(0,0,0,.35);
  }
  .card:hover, .card:focus-visible { transform: translateY(-3px); border-color: var(--gold); outline: none; box-shadow: 0 14px 36px rgba(0,0,0,.45); }
  .card .tag { display: inline-block; font-size: 13px; letter-spacing: .02em; color: var(--ink); background: var(--gold); border-radius: 999px; padding: 3px 10px; margin-bottom: 8px; font-weight: 700; }
  .card h2 { margin: 0 0 8px; font-size: 26px; font-weight: 900; }
  .card p { margin: 0; font-size: 15px; line-height: 1.6; opacity: .92; }
  .controls-hint { margin: 18px 0 0; font-size: 14px; opacity: .8; line-height: 1.7; }
  kbd { font-family: inherit; background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.3); border-radius: 6px; padding: 1px 6px; }

  /* HUD */
  #hud {
    position: fixed; top: 12px; right: 12px; width: min(300px, calc(100% - 24px));
    background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px;
    box-shadow: 0 8px 26px rgba(0,0,0,.35); font-size: 14px; line-height: 1.5; max-height: calc(100vh - 24px); overflow: auto;
  }
  #hud .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  #hud .faction { font-size: 12px; background: var(--gold); color: var(--ink); border-radius: 999px; padding: 2px 9px; font-weight: 700; }
  #hud h3 { margin: 8px 0 2px; font-size: 17px; font-weight: 900; color: var(--gold); }
  #hud .step { font-size: 15px; font-weight: 500; }
  #hud .progress { font-size: 13px; color: var(--gold); min-height: 1em; margin-top: 2px; }
  #hud .stats { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; margin: 10px 0; font-size: 13px; opacity: .95; }
  #hud .stats span:nth-child(odd) { opacity: .7; }
  #hud ol { margin: 6px 0 0; padding: 0; list-style: none; font-size: 13px; }
  #hud li { padding: 3px 0; opacity: .6; }
  #hud li.now { opacity: 1; font-weight: 700; color: var(--gold); }
  #hud li.done { text-decoration: line-through; opacity: .45; }
  #restart {
    margin-top: 10px; font: inherit; font-size: 13px; color: var(--cream); background: transparent;
    border: 1px solid var(--line); border-radius: 8px; padding: 5px 10px; cursor: pointer;
  }

  #minimap {
    position: fixed; left: 12px; bottom: 12px; width: 170px; height: 170px; border-radius: 12px;
    border: 2px solid var(--line); box-shadow: 0 8px 22px rgba(0,0,0,.35); background: var(--sand);
  }

  #prompt {
    position: fixed; bottom: 26px; left: 50%; transform: translateX(-50%);
    background: var(--panel); border: 1px solid var(--gold); border-radius: 999px; padding: 9px 18px;
    font-size: 15px; font-weight: 700; white-space: nowrap; pointer-events: none;
  }

  #toasts {
    position: fixed; top: 14px; left: 50%; transform: translateX(-50%); width: min(560px, calc(100% - 32px));
    display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none;
  }
  .toast {
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 9px 14px;
    font-size: 15px; line-height: 1.45; box-shadow: 0 6px 18px rgba(0,0,0,.3); animation: pop .25s ease-out; max-width: 100%;
  }
  .toast.win { background: #3b2a0b; border-color: var(--gold); font-weight: 700; }
  .toast.intro { font-size: 15px; }
  @keyframes pop { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }

  @media (max-width: 720px) {
    .cards { grid-template-columns: 1fr; }
    #hud { top: auto; bottom: 12px; right: 12px; left: 12px; width: auto; max-height: 36vh; font-size: 13px; }
    #hud ol { display: none; }
    #minimap { width: 110px; height: 110px; left: 12px; bottom: auto; top: 12px; }
    #prompt { bottom: calc(36vh + 26px); }
  }
</style>
</head>
<body>
<canvas id="scene" aria-label="מפת מצרים בתלת מימד"></canvas>

<div id="intro">
  <div class="intro-box">
    <h1>מצרים: המסע</h1>
    <p>הארץ כולה פתוחה לפניך: הנילוס, הכפרים, השווקים והפירמידות. בחר את הדרך שלך.</p>
    <div class="cards">
      <button class="card" type="button" data-faction="egypt">
        <span class="tag">שליח הפרעה</span>
        <h2>מצרי</h2>
        <p>אתה משרת בחצר הארמון. הוזיר צריך תבואה מהשדה, ואחר כך הפירמידות והספינקס מחכים לך.</p>
      </button>
      <button class="card" type="button" data-faction="hebrew">
        <span class="tag">בן גושן</span>
        <h2>עברי</h2>
        <p>אתה גר בכפר גושן שבצד היאור. הזקן מבקש עזרה, אמא צמאה למים, ואתה צריך לחצות את הגשר.</p>
      </button>
    </div>
    <p class="controls-hint">
      הליכה: <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> או חצים · ריצה: <kbd>Shift</kbd> · אינטראקציה: <kbd>E</kbd><br>
      סיבוב מצלמה: גרירה בעכבר · זום: גלגלת
    </p>
  </div>
</div>

<aside id="hud" hidden>
  <div class="row"><span class="faction" id="hud-faction"></span></div>
  <h3 id="hud-quest"></h3>
  <div class="step" id="hud-step"></div>
  <div class="progress" id="hud-progress"></div>
  <div class="stats">
    <span>נקודות</span><span id="hud-score"></span>
    <span>אתרים שגילית</span><span id="hud-found"></span>
    <span>בתיק</span><span id="hud-pack"></span>
  </div>
  <ol id="hud-steps"></ol>
  <button id="restart" type="button">התחל מחדש</button>
</aside>

<canvas id="minimap" width="340" height="340" hidden aria-label="מפה קטנה"></canvas>
<div id="prompt" hidden></div>
<div id="toasts" aria-live="polite"></div>

<script type="module" src="./main.js"></script>
</body>
</html>
