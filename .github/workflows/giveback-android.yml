# Builds the GiveBack Android app (in giveback/) and publishes GiveBack.apk on
# this repository's Releases page, ready to download and install on a phone.
# Interim home until the app moves to its own repository, which carries the
# same workflow in giveback/.github/workflows/android.yml.
#
# Repository → Settings → Secrets and variables → Actions → New repository secret:
#   EXPO_PUBLIC_SUPABASE_URL, EXPO_PUBLIC_SUPABASE_ANON_KEY   (required for a working app)
#   GOOGLE_MAPS_ANDROID_KEY                                   (optional: in-app maps)
name: Android app

on:
  push:
    branches: [main, claude/giveback-item-sharing-app-9rxd7v]
    paths: ['giveback/**', '.github/workflows/giveback-android.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: giveback
    env:
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
      GOOGLE_MAPS_ANDROID_KEY: ${{ secrets.GOOGLE_MAPS_ANDROID_KEY }}
      EXPO_PUBLIC_AI_ENABLED: 'false'
      CI: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: giveback/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Install
        run: npm ci

      - name: Check
        run: |
          npx tsc --noEmit
          npx eslint .
          npx jest --ci

      - name: Generate the Android project
        run: npx expo prebuild --platform android --clean --no-install

      - name: Build the APK
        working-directory: giveback/android
        # Production only here: set for the whole job it would make npm ci
        # skip the dev tools the checks need.
        env:
          NODE_ENV: production
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a

      - name: Name it
        run: |
          mkdir -p build
          cp android/app/build/outputs/apk/release/app-release.apk build/GiveBack.apk
          if [ -z "$EXPO_PUBLIC_SUPABASE_URL" ]; then
            echo "::warning::EXPO_PUBLIC_SUPABASE_URL is not set — this APK opens on a 'not connected yet' screen."
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: GiveBack-android
          path: giveback/build/GiveBack.apk

      - name: Publish on the Releases page
        uses: softprops/action-gh-release@v2
        with:
          tag_name: giveback-android-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: GiveBack לאנדרואיד — גרסה ${{ github.run_number }}
          body: |
            להתקנה: פותחים את הקישור הזה בטלפון האנדרואיד, מורידים את **GiveBack.apk** ומתקינים.
            אם הטלפון שואל — מאשרים "התקנה ממקורות לא ידועים".
            ${{ env.EXPO_PUBLIC_SUPABASE_URL == '' && '⚠️ הגרסה הזו עוד לא מחוברת לשרת (חסרים הסודות EXPO_PUBLIC_SUPABASE_URL ו-EXPO_PUBLIC_SUPABASE_ANON_KEY).' || '' }}
          files: giveback/build/GiveBack.apk
          make_latest: true
